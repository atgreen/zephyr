description: |
  Interrupt controller of the mox125 simulation.  A read of the first
  register gives the pending sources, the second holds the enable mask.

compatible: "moxie,sim-pic"

include: [interrupt-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  "#interrupt-cells":
    const: 1

interrupt-cells:
  - irq
